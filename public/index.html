<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulaire</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Générateur de QR Code</h1>
            <p>Entrer l'url de votre site web:</p>
            <form id="qrForm">
                <input type="url" id="url" placeholder="https://exemple.com" required>
                <button type="submit">Générer</button>
            </form>
            <div id="resultat">
                <img id="qrImage" alt="QR Code genéré">
                <p id="message"></p>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
